on:
  pull_request_review:
    types: [submitted]

jobs:
  approved:
    if: github.event.review.state == 'APPROVED'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Check unfixed migrations
        run: if [ $(ls migrations/ | grep -v '^00' | wc -l) -ne 0 ]; then echo "Need to fix migrations."; exit 1; else exit 0; fi
