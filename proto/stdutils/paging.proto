syntax = "proto3";

package stdutils;

message PagingOffsetRequest {
  optional int32 offset = 1;
  int32 limit = 2;
}

message PagingOffsetResponse {
  int64 total_count = 1;
}

message PagingCursorRequest {
  optional string exclusive_start_id = 1;
  int32 limit = 2;
}

message PagingCursorResponse {
  optional string last_evaluated_id = 1;
  int64 total_count = 2;
}
